<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Refactor — Live Interactive Browser Playground REPL</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --green: #4ade80;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px 24px;
      background-color: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      color: var(--accent);
    }
    .badge {
      background: #0284c7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      gap: 1px;
      background-color: var(--border);
    }
    .editor-pane {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .pane-header {
      background: var(--panel);
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      border-bottom: 1px solid var(--border);
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: monospace;
      font-size: 14px;
      padding: 16px;
      outline: none;
      resize: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Tailwind Refactor Live REPL</h1>
    <span class="badge">v1.0.0 Ready</span>
  </header>
  <main>
    <div class="editor-pane">
      <div class="pane-header">Input Code (React / TSX)</div>
      <textarea id="inputCode" spellcheck="false"></textarea>
    </div>
    <div class="editor-pane">
      <div class="pane-header">Canonical Refactored Output</div>
      <textarea id="outputCode" readonly spellcheck="false"></textarea>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
